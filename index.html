
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>RIAD AI ASI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#080d18;color:#fff;
font-family:Arial,sans-serif;
}
.app{
max-width:600px;min-height:100vh;
margin:auto;padding:25px 18px;
display:flex;flex-direction:column;
}
header{text-align:center;padding:30px 0}
h1{color:#53d9ff;letter-spacing:4px}
.status{color:#55d99a;font-size:13px}
#chat{flex:1;padding:15px 0}
.message{
padding:14px;border-radius:15px;
margin:12px 0;line-height:1.5;
}
.ai{background:#17263b}
.user{background:#075b79;margin-left:25px}
.controls{display:flex;gap:8px}
input{
flex:1;min-width:0;padding:15px;
border-radius:12px;border:1px solid #30445d;
background:#111d30;color:white;font-size:16px;
}
button{
border:0;border-radius:12px;padding:14px;
background:#087da5;color:white;font-size:16px;
}
#voice{margin-top:12px;background:#174b65}
</style>
</head>
<body>
<div class="app">
<header>
<h1>RIAD AI ASI</h1>
<div class="status">● СИСТЕМА ГОТОВА</div>
<p>Твой персональный ИИ-ассистент</p>
</header>
<div id="chat">
<div class="message ai">
Привет! Я RIAD AI ASI. Чем могу помочь?
</div>
</div>
<div class="controls">
<input id="question" placeholder="Напиши сообщение...">
<button id="send">➤</button>
</div>
<button id="voice">🎙 Голосовой ввод</button>
</div>
<script>
const input=document.getElementById('question');
const chat=document.getElementById('chat');

function addMessage(text,type){
const el=document.createElement('div');
el.className='message '+type;
el.textContent=text;
chat.appendChild(el);
}

function sendMessage(){
const value=input.value.trim();
if(!value)return;
addMessage(value,'user');
input.value='';
addMessage('Сообщение принято. Подключение ИИ-модели будет следующим этапом.','ai');
}

document.getElementById('send').onclick=sendMessage;
input.addEventListener('keydown',e=>{
if(e.key==='Enter')sendMessage();
});

document.getElementById('voice').onclick=()=>{
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Speech){
addMessage('Голосовой ввод не поддерживается этим браузером.','ai');
return;
}
const recognition=new Speech();
recognition.lang='ru-RU';
recognition.onresult=e=>{
input.value=e.results[0][0].transcript;
sendMessage();
};
recognition.start();
};
</script>
</body>
</html>
